# Netlify config — IMPORTANT: Netlify only serves the CLIENT (static React).
#
# The backend (Express + tRPC + scraper) is NOT run here. You must deploy it
# separately (see render.yaml) and point the client at it by setting the
# environment variable below in Netlify's dashboard:
#
#   Site settings -> Build & deploy -> Environment -> Environment variables
#     VITE_API_URL = https://<your-backend-host>   (no trailing slash)
#
# Without VITE_API_URL, the client calls /api/trpc on the Netlify origin,
# which falls through to the SPA redirect below and returns index.html.
# That is why searching returns no results on a Netlify-only deployment.

[build]
  command = "pnpm build:client"
  publish = "dist/public"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
