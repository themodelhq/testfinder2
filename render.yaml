# Render Blueprint for the Jumia SKU Finder & Product Grabber.
#
# Usage: from the Render dashboard choose "New" -> "Blueprint", point it at
# the repo/zip containing this file, and Render will provision the web
# service with the settings below. During the initial setup Render prompts
# for every env var marked `sync: false`.
#
# Note on the build command:
#   npm install fails with ERESOLVE on this project because
#   @builder.io/vite-plugin-jsx-loc declares a peer-dep on Vite 4/5 while
#   this project uses Vite 7. We pass --legacy-peer-deps to tell npm to
#   fall back to the pre-npm7 resolution strategy, which is the documented
#   workaround and matches what works locally.

services:
  - type: web
    name: jumia-sku-finder
    runtime: node
    plan: starter
    # Build: install deps (working around the Vite peer-dep mismatch) then
    # run the project's own build script (Vite client + esbuild server).
    buildCommand: npm install --legacy-peer-deps && npm run build
    # Start: the existing `start` npm script — NODE_ENV=production node dist/index.js
    startCommand: npm run start
    # Health check hits the Express root. If you add a dedicated /healthz
    # route later, point this at it.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render sets PORT automatically; the server already reads it.
      - key: NODE_ENV
        value: production

      # --- Required secrets: Render will prompt for these on first deploy.
      # MySQL / TiDB connection string used by Drizzle. Example:
      #   mysql://user:pass@host:4000/dbname?ssl={"rejectUnauthorized":true}
      - key: DATABASE_URL
        sync: false

      # HMAC secret for signing session/JWT cookies. Any long random string.
      - key: JWT_SECRET
        sync: false

      # --- Optional but recommended. Set any that apply; Render will still
      #     start the service without them, it just disables related features.
      # Absolute URL of the deployed frontend. REQUIRED if you host the
      # client on a different origin (e.g. Netlify) — the server uses it as
      # the CORS `origin` and for OAuth redirects. Without it, cross-origin
      # browser requests from the client WILL be blocked by CORS and the
      # search UI will appear to "return no results".
      # Example: https://findertesty2.netlify.app  (no trailing slash)
      - key: FRONTEND_URL
        sync: false

      # OAuth provider base URL (if you use the built-in OAuth login flow).
      - key: OAUTH_SERVER_URL
        sync: false

      # Open ID of the workspace owner, used for admin gating.
      - key: OWNER_OPEN_ID
        sync: false

      # Forge / AI API key used by the LLM integration.
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
